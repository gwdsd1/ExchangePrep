<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ExchangePrep · 项目申请调查 Demo</title>
  <style>
    :root { color-scheme: light; --ink:#19222c; --muted:#64717c; --line:#dce5e6; --paper:#ffffff; --bg:#f3f7f6; --teal:#087e75; --teal-dark:#08645d; --amber:#fff3d9; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:"Segoe UI","Microsoft YaHei",sans-serif; line-height:1.55; }
    main { max-width:1100px; margin:0 auto; padding:28px 20px 60px; }
    h1 { font-size:2rem; margin:0 0 4px; letter-spacing:-.02em; }
    h2 { font-size:1.35rem; margin:0 0 14px; }
    h3 { font-size:1.05rem; margin:0 0 8px; }
    p { margin:6px 0 14px; }
    .eyebrow { font-size:.78rem; font-weight:700; letter-spacing:.12em; color:var(--teal); text-transform:uppercase; }
    .lede { color:var(--muted); max-width:820px; }
    .panel { background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:22px; box-shadow:0 6px 22px #253b3b08; margin-top:20px; }
    .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
    label { display:flex; flex-direction:column; gap:6px; font-size:.88rem; font-weight:650; }
    input,select { width:100%; border:1px solid #bdcbce; border-radius:9px; padding:10px 11px; font:inherit; background:white; color:var(--ink); min-height:42px; }
    input:focus,select:focus { outline:2px solid #8ad8cd; border-color:var(--teal); }
    .span2 { grid-column:span 2; }
    .actions { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:18px; }
    button,.button-link { border:0; border-radius:10px; background:var(--teal); color:#fff; padding:11px 17px; font:inherit; font-weight:700; cursor:pointer; text-decoration:none; }
    button:hover,.button-link:hover { background:var(--teal-dark); }
    button:disabled { opacity:.55; cursor:wait; }
    button.secondary { background:#e5f2f0; color:var(--teal-dark); }
    .status { color:var(--muted); font-size:.9rem; }
    .warning { background:var(--amber); border:1px solid #efd7a4; padding:12px 14px; border-radius:10px; margin:12px 0; }
    .error { background:#fff0ec; border:1px solid #efc7b9; padding:12px 14px; border-radius:10px; color:#9b3326; }
    .programme { border:1px solid var(--line); border-radius:13px; padding:18px; margin-top:16px; }
    .programme-head { display:flex; justify-content:space-between; gap:12px; align-items:start; flex-wrap:wrap; }
    .pill { display:inline-block; border-radius:999px; padding:3px 9px; background:#e5f2f0; color:var(--teal-dark); font-size:.78rem; font-weight:700; }
    .steps { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-top:14px; }
    .step { border:1px solid var(--line); border-radius:11px; padding:15px; background:#fcfefe; }
    .step h4 { margin:0 0 10px; }
    .row { margin:7px 0; overflow-wrap:anywhere; }
    .row strong { display:block; color:#52616a; font-size:.78rem; text-transform:uppercase; letter-spacing:.04em; }
    .dim { color:var(--muted); }
    .tag { display:inline-block; font-size:.72rem; border-radius:5px; padding:1px 5px; margin-left:4px; background:#edf0f2; color:#54616a; }
    .tag.verified { background:#dcf2e8; color:#1e704f; }
    .tag.historical,.tag.needs_review,.tag.conflicting { background:#fff0d1; color:#865713; }
    .evidence { display:block; font-size:.8rem; color:#52616a; margin-top:3px; border-left:2px solid #bfdbd6; padding-left:8px; }
    a { color:#08766e; }
    .small { font-size:.83rem; }
    .list { margin:8px 0; padding-left:20px; }
    .sources li { margin:6px 0; overflow-wrap:anywhere; }
    @media(max-width:800px) { .grid,.steps { grid-template-columns:1fr; } .span2 { grid-column:span 1; } }
  </style>
</head>
<body>
<main>
  <div class="programme-head"><div class="eyebrow">ExchangePrep · Research Module</div><button id="language-button" type="button" class="secondary" aria-label="Switch to English">English</button></div>
  <h1>把申请要求查清楚</h1>
  <p class="lede">输入你的目标，先检索本地知识库，再从官网与社媒寻找项目，并访问知识库中的相关公开链接。登录页只提供网址。申请步骤、材料、截止规则和证据可导出 JSON，交给时间线模块。</p>
  <section class="panel">
    <h2>学生目标</h2>
    <form id="research-form">
      <div class="grid">
        <label>大模型服务<select name="model_provider"><option value="openai">OpenAI</option><option value="deepseek">DeepSeek</option></select></label>
        <label>计划类型<select name="programme_type" required><option value="summer_school">暑校</option><option value="winter_school">寒校</option><option value="exchange">学期交换</option></select></label>
        <label>目的地<input name="destination" required value="United Kingdom" placeholder="国家或地区"></label>
        <label>专业<input name="major" value="Computer Science" placeholder="例如 Computer Science"></label>
        <label>开始时间<input name="start_date" type="date" required></label>
        <label>结束时间<input name="end_date" type="date" required></label>
        <label>年级<input name="year_of_study" type="number" min="1" max="8" value="2"></label>
        <label>兴趣<input name="interests" placeholder="例如 AI、游戏开发"></label>
        <label>国籍<input name="nationality" placeholder="用于检索签证规定"></label>
        <label>当前居住地<input name="residence" value="Hong Kong"></label>
        <label>预算<input name="budget" placeholder="例如 HKD 40000"></label>
        <label class="span2">具体项目官网（可选）<input name="programme_url" type="url" placeholder="https://目标院校官网/项目页面"></label>
        <label>调查项目数量<select name="max_programmes"><option value="1">1 个，深入调查</option><option value="2" selected>2 个</option><option value="3">3 个</option></select></label>
      </div>
      <div class="actions"><button id="run-button" type="submit">开始联网调查</button><button id="sample-button" type="button" class="secondary">查看离线示例</button><span class="status" id="status">正在检查本地配置…</span></div>
    </form>
    <h3 style="margin-top:20px">也可以单独查询知识库（不需要 API Key）</h3>
    <div class="actions"><input id="knowledge-query" placeholder="例如：英国签证、成绩单、学分转换" maxlength="300" aria-label="知识库搜索词"><button id="knowledge-button" type="button" class="secondary">查询知识库</button><a href="/api/knowledge-base/document" target="_blank" rel="noopener">查看完整 Markdown</a></div>
  </section>
  <section class="panel" id="result-panel" hidden>
    <div class="programme-head"><h2>调查结果</h2><button type="button" class="secondary" id="download-button" hidden>下载给时间线模块的 JSON</button></div>
    <div id="results"></div>
  </section>
</main>
<script>
const EN = {
  'ExchangePrep · 项目申请调查 Demo':'ExchangePrep · Application Research Demo',
  '把申请要求查清楚':'Make application requirements clear',
  '输入你的目标，先检索本地知识库，再从官网与社媒寻找项目，并访问知识库中的相关公开链接。登录页只提供网址。申请步骤、材料、截止规则和证据可导出 JSON，交给时间线模块。':'Enter your goals. We search the local knowledge base, official websites and social leads, and read relevant public links. Login pages are provided as links only. Export steps, documents, deadlines and evidence as JSON for timeline planning.',
  '学生目标':'Your study-abroad goals', '大模型服务':'AI provider', '计划类型':'Programme type',
  '暑校':'Summer school', '寒校':'Winter school', '学期交换':'Semester exchange',
  '目的地':'Destination', '专业':'Major', '开始时间':'Start date', '结束时间':'End date',
  '年级':'Year of study', '兴趣':'Interests', '国籍':'Nationality', '当前居住地':'Current residence',
  '预算':'Budget', '具体项目官网（可选）':'Programme website (optional)', '调查项目数量':'Number of programmes',
  '1 个，深入调查':'1 — in-depth research', '2 个':'2 programmes', '3 个':'3 programmes',
  '国家或地区':'Country or region', '例如 Computer Science':'e.g. Computer Science',
  '例如 AI、游戏开发':'e.g. AI, game development', '用于检索签证规定':'Used to research entry requirements',
  '例如 HKD 40000':'e.g. HKD 40000', 'https://目标院校官网/项目页面':'https://university.edu/programme',
  '开始联网调查':'Start online research', '查看离线示例':'View offline sample',
  '正在检查本地配置…':'Checking local configuration…',
  '也可以单独查询知识库（不需要 API Key）':'Search the knowledge base separately (no API key required)',
  '例如：英国签证、成绩单、学分转换':'e.g. UK visa, transcript, credit transfer', '知识库搜索词':'Knowledge-base query',
  '查询知识库':'Search knowledge base', '查看完整 Markdown':'View full Markdown',
  '调查结果':'Research results', '下载给时间线模块的 JSON':'Download JSON for timeline planning',
  '尚未取得依据，请查看下方来源并核对适用要求。':'No supporting information yet. Check the sources below for applicable requirements.',
  '已核实':'Verified', '历史参考':'Historical', '存在冲突':'Conflicting', '待核实':'Needs review',
  '证据：':'Evidence: ', '尚未取得截止说明。':'No deadline guidance found yet.',
  '来源说明无固定截止；仍需核对个人办理条件。':'The source states no fixed deadline; confirm personal eligibility and conditions.',
  '未取得适用截止；请核对官方入口的申请周期，不按推测日期排期。':'No applicable deadline confirmed. Check the official application cycle; do not schedule using guessed dates.',
  '本地知识库命中（{count} 段）':'Knowledge-base matches ({count} sections)',
  '整理资料不是本次官网验证；公众号经验、历史日期和学院适用范围需保留。':'Curated information is not live verification. Keep historical, faculty and source-specific limitations. Original source text is not translated.',
  '调查方式':'Research method', '已读取公开网页':'Public pages read',
  '尚未确认具体项目。请检查搜索提示，或提供目标院校的官方项目链接。':'No programme confirmed yet. Check the search notes or provide an official programme URL.',
  '项目官网 ↗':'Programme website ↗', '项目日期':'Programme dates', '资格要求':'Eligibility', '费用':'Costs',
  '往届案例（历史参考）':'Previous cases (historical)', '具体操作':'What to do', '办理入口':'Application / guidance links',
  '截止规则':'Deadline rules', '适用条件':'Applies if', '前置步骤':'Prerequisites', '申请材料':'Required documents',
  '备注（待核实）：{fields}包含参考信息，尚未确认适用于你的年度、项目或个人身份。请以当年官方要求和个人通知为准，未确认日期不用于自动排期。':'Note (needs review): {fields} contains reference information not yet confirmed for your year, programme or circumstances. Follow current official requirements and personal notices. Unconfirmed dates are not used for automatic scheduling.',
  '仍需核查':'Still to check', '社媒项目与经验线索':'Social-media programme and experience leads',
  '以下来自搜索结果摘要，尚未确认笔记全文；用于发现项目和经验，不作为当前申请要求。':'These are search-result snippets, not verified full posts. Use them as discovery leads, not current requirements.',
  '平台':'Platform', '发现用搜索词':'Discovery query', '搜索记录（{count} 次）':'Search log ({count} searches)',
  '有结果':'Results', '没有结果':'No results', '访问失败':'Access failed', '{state} · {count} 条':'{state} · {count} results',
  '资料来源（网页与本地知识库）':'Sources (websites and local knowledge base)',
  '（需要登录：仅提供网址，请自行查看）':' (Login required: link only; please check it yourself.)',
  '正在查询项目线索、院校官网及申请详情；可能需要数分钟…':'Researching programmes, official websites and application details; this may take a few minutes…',
  '联网调查进行中，请稍候。':'Online research is in progress. Please wait.',
  '完成：{programmes} 个项目，{sources} 个来源。':'Complete: {programmes} programmes, {sources} sources.',
  '调查未完成。':'Research did not complete.', '请输入知识库搜索词。':'Enter a knowledge-base query.', '查询失败':'Search failed',
  '没有匹配内容；可换用国家名称或办理事项。':'No matches. Try a country name or application task.',
  '已查询本地知识库；本次没有联网或调用大模型。':'Local knowledge base searched; no online search or model call was made.',
  '离线示例加载失败。':'Failed to load the offline sample.',
  '已载入离线示例；没有执行实时搜索。':'Offline sample loaded; no live search was performed. Sample content keeps its original language.',
  '已就绪：{provider} 模型，可自动搜索。':'Ready: {provider}; automatic search available.',
  '已就绪：{provider} 模型；提供项目官网可进行定向调查。':'Ready: {provider}; provide a programme URL for targeted research.',
  '缺少模型 API Key：请按 README 配置后重启服务。':'No model API key configured. Follow README and restart the server.',
  '无法读取服务配置。':'Unable to read server configuration.',
  'summer_school':'Summer school', 'winter_school':'Winter school', 'exchange':'Semester exchange',
  'host_application':'Host application', 'hku_application':'HKU application / registration', 'nomination':'Nomination',
  'offer_acceptance':'Offer acceptance', 'funding':'Funding', 'visa':'Visa / entry', 'credit_transfer':'Credit transfer',
  'insurance':'Insurance', 'accommodation':'Accommodation', 'other':'Other',
  'read':'Read', 'unavailable':'Unavailable', 'login_required':'Login required', 'knowledge_base':'Local knowledge base',
  'hku':'HKU', 'host':'Host institution', 'government':'Government', 'social':'Social media'
};
const ZH = {summer_school:'暑校', winter_school:'寒校', exchange:'学期交换', host_application:'目标院校申请',
  hku_application:'HKU 申请／登记', nomination:'提名', offer_acceptance:'接受名额', funding:'资助', visa:'签证／入境',
  credit_transfer:'学分转换', insurance:'保险', accommodation:'住宿', other:'其他', read:'已读取', unavailable:'不可用',
  login_required:'需要登录', knowledge_base:'本地知识库', hku:'HKU', host:'目标院校', government:'政府', social:'社媒'};
let language = 'zh';
try { language = localStorage.getItem('exchangeprep_language') === 'en' ? 'en' : 'zh'; } catch {}
function t(key, values={}) {
  const text = (language === 'en' ? EN[key] : ZH[key]) || key;
  return text.replace(/\{(\w+)\}/g, (match, name) => values[name] ?? match);
}
const staticTextNodes = [];
const walker = document.createTreeWalker(document.querySelector('main'), NodeFilter.SHOW_TEXT);
while (walker.nextNode()) {
  const node = walker.currentNode, key = node.nodeValue.trim();
  if (EN[key] && node.parentElement.id !== 'status') staticTextNodes.push({node, key});
}
const staticAttributes = [...document.querySelectorAll('input')].flatMap(node => ['placeholder', 'aria-label']
  .filter(attribute => node.hasAttribute(attribute)).map(attribute => ({node, attribute, key:node.getAttribute(attribute)})));
let statusKey = '正在检查本地配置…', statusValues = {};
function setStatus(key, values={}) { statusKey = key; statusValues = values; status.textContent = t(key, values); }
const form = document.getElementById('research-form');
const status = document.getElementById('status');
const results = document.getElementById('results');
const panel = document.getElementById('result-panel');
const runButton = document.getElementById('run-button');
const sampleButton = document.getElementById('sample-button');
const downloadButton = document.getElementById('download-button');
let lastResult = null;
let lastKnowledge = null;
let busy = false;
function setLanguage(next) {
  language = next;
  document.documentElement.lang = next === 'en' ? 'en' : 'zh-CN';
  document.title = t('ExchangePrep · 项目申请调查 Demo');
  for (const {node, key} of staticTextNodes) node.nodeValue = t(key);
  for (const {node, attribute, key} of staticAttributes) node.setAttribute(attribute, t(key));
  const button = document.getElementById('language-button');
  button.textContent = next === 'en' ? '中文' : 'English';
  button.setAttribute('aria-label', next === 'en' ? '切换为中文' : 'Switch to English');
  try { localStorage.setItem('exchangeprep_language', next); } catch {}
  setStatus(statusKey, statusValues);
  if (!busy && lastResult) render(lastResult);
  else if (!busy && lastKnowledge) { results.replaceChildren(); renderKnowledge(results, lastKnowledge); }
}
document.getElementById('language-button').addEventListener('click', () => setLanguage(language === 'en' ? 'zh' : 'en'));

function el(tag, text='', className='') {
  const node = document.createElement(tag);
  node.textContent = text;
  if (className) node.className = className;
  return node;
}
function link(url, label) {
  // Never turn model-provided javascript:/data: URLs into executable links.
  if (!/^(https?:\/\/|mailto:|\/api\/knowledge-base(?:\/document)?(?:\?|$))/.test(url)) return el('span', label || url);
  const a = el('a', label || url);
  a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
  return a;
}
function linkedText(parent, value) {
  const text = String(value || '');
  function plain(part) {
    const pattern = /https?:\/\/[^\s<>"\[\]，。；、]+|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g;
    let offset = 0;
    for (const match of part.matchAll(pattern)) {
      let url = match[0];
      if (/^https?:/.test(url)) {
        url = url.replace(/[.,;!?:]+$/, '');
        while (url.endsWith(')') && (url.match(/\)/g) || []).length > (url.match(/\(/g) || []).length) url = url.slice(0, -1);
      }
      parent.appendChild(document.createTextNode(part.slice(offset, match.index)));
      parent.appendChild(link(url.includes('://') ? url : `mailto:${url}`, url));
      offset = match.index + url.length;
    }
    parent.appendChild(document.createTextNode(part.slice(offset)));
  }
  // Scan balanced parentheses so URLs such as Application(2027).pdf remain intact.
  const pattern = /\[([^\]\n]+)\]\((https?:\/\/)/g;
  let offset = 0, match;
  while ((match = pattern.exec(text))) {
    const start = match.index + match[0].length - match[2].length;
    let end = start, depth = 1;
    while (end < text.length && depth && !/\s/.test(text[end])) {
      if (text[end] === '(') depth++;
      if (text[end] === ')') depth--;
      end++;
    }
    if (depth) continue;
    plain(text.slice(offset, match.index));
    parent.appendChild(link(text.slice(start, end - 1), match[1]));
    offset = end;
    pattern.lastIndex = end;
  }
  plain(text.slice(offset));
}
function linkedEl(tag, text, className='') {
  const node = el(tag, '', className);
  linkedText(node, text);
  return node;
}
function row(parent, title, value, state) {
  const box = el('div', '', 'row');
  box.appendChild(el('strong', t(title)));
  const display = typeof value === 'string' ? value
    .replace(/参考入口（实际提交渠道待核实）：/g, '参考入口：')
    .replace(/材料参考（不是已确认必交清单）/g, '材料参考')
    .replace(/时间参考，不能直接排期：/g, '时间参考：') : value;
  box.appendChild(linkedEl('span', display || t('尚未取得依据，请查看下方来源并核对适用要求。'), value ? '' : 'dim'));
  const states = {verified:'已核实', needs_review:'待核实', historical:'历史参考', conflicting:'存在冲突', unknown:'待核实'};
  if (state && !['needs_review', 'unknown'].includes(state)) box.appendChild(el('span', t(states[state] || state), `tag ${state}`));
  parent.appendChild(box);
  return box;
}
function fact(parent, title, item, sourceMap) {
  const box = row(parent, title, item?.value, item?.state);
  for (const evidence of item?.evidence || []) {
    const source = sourceMap[evidence.source_id];
    const note = el('span', '', 'evidence');
    note.appendChild(linkedEl('span', `${t('证据：')}${evidence.quote} `));
    if (source) note.appendChild(link(source.url, `[${evidence.source_id}]`));
    box.appendChild(note);
  }
}
function reviewNotice(parent, fields, notes=[]) {
  const pending = [...new Set(fields.filter(([, item]) => !item?.state || ['needs_review', 'unknown'].includes(item.state)).map(([label]) => label))];
  const boilerplate = new Set([
    '参考资料未确认适用于你的年度、项目和个人身份；其中旧年份、费用与资格不可直接作为当前要求。',
    '未找到足够的官方信息，此步骤需要人工核查。'
  ]);
  const details = [...new Set(notes)].filter(note => !boilerplate.has(note));
  if (pending.length) {
    const message = t('备注（待核实）：{fields}包含参考信息，尚未确认适用于你的年度、项目或个人身份。请以当年官方要求和个人通知为准，未确认日期不用于自动排期。', {fields:pending.map(label => t(label)).join(language === 'en' ? ', ' : '、')});
    parent.appendChild(linkedEl('p', [message, ...details.map(note => note.replace(/待核实/g, '需确认'))].join(' '), 'warning small review-note'));
  } else if (details.length) {
    parent.appendChild(linkedEl('p', details.join(' '), 'dim small'));
  }
}
function deadlineText(deadline) {
  if (!deadline) return t('尚未取得截止说明。');
  const parts = [deadline.date, deadline.raw, deadline.trigger ? `${language === 'en' ? 'Trigger: ' : '触发条件：'}${deadline.trigger}` : null].filter(Boolean);
  return parts.length ? [...new Set(parts)].join(' · ') : t(deadline.kind === 'none' ? '来源说明无固定截止；仍需核对个人办理条件。' : '未取得适用截止；请核对官方入口的申请周期，不按推测日期排期。');
}
function renderKnowledge(parent, matches) {
  if (!matches?.length) return;
  parent.appendChild(el('h3', t('本地知识库命中（{count} 段）', {count:matches.length})));
  parent.appendChild(el('p', t('整理资料不是本次官网验证；公众号经验、历史日期和学院适用范围需保留。'), 'dim small'));
  for (const match of matches) {
    const details = el('details', '', 'programme');
    details.appendChild(el('summary', match.title));
    const text = linkedEl('pre', match.text, 'small');
    text.style.cssText = 'white-space:pre-wrap;overflow-wrap:anywhere;max-height:320px;overflow:auto';
    details.appendChild(text);
    for (const [label, url] of Object.entries(match.links || {})) {
      const entry = el('div', '', 'small');
      entry.appendChild(link(url, label));
      details.appendChild(entry);
    }
    parent.appendChild(details);
  }
}
function render(data) {
  results.replaceChildren();
  const sourceMap = Object.fromEntries((data.sources || []).map(source => [source.id, source]));
  row(results, '调查方式', data.provider);
  row(results, '已读取公开网页', String((data.sources || []).filter(source => source.read_status === 'read' && source.publisher_type !== 'knowledge_base').length));
  for (const warning of data.warnings || []) results.appendChild(linkedEl('div', warning, 'warning small'));
  renderKnowledge(results, data.knowledge_matches);
  if (!data.programmes?.length) results.appendChild(el('p', t('尚未确认具体项目。请检查搜索提示，或提供目标院校的官方项目链接。')));
  for (const programme of data.programmes || []) {
    const card = el('article', '', 'programme');
    const head = el('div', '', 'programme-head');
    const h3 = el('h3', programme.name);
    head.appendChild(h3);
    head.appendChild(el('span', t(programme.programme_type), 'pill'));
    card.appendChild(head);
    if (programme.official_url) card.appendChild(link(programme.official_url, t('项目官网 ↗')));
    fact(card, '项目日期', programme.dates, sourceMap);
    for (const item of programme.eligibility || []) fact(card, '资格要求', item, sourceMap);
    for (const item of programme.costs || []) fact(card, '费用', item, sourceMap);
    for (const item of programme.past_cases || []) fact(card, '往届案例（历史参考）', item, sourceMap);
    reviewNotice(card, [['项目日期', programme.dates],
      ...(programme.eligibility || []).map(item => ['资格要求', item]),
      ...(programme.costs || []).map(item => ['费用', item])]);
    const steps = el('div', '', 'steps');
    for (const step of programme.steps || []) {
      const stepCard = el('div', '', 'step');
      stepCard.appendChild(el('h4', step.title));
      stepCard.appendChild(el('span', t(step.category), 'pill'));
      fact(stepCard, '具体操作', step.action, sourceMap);
      fact(stepCard, '办理入口', step.channel, sourceMap);
      const dl = {value: deadlineText(step.deadline), state: step.deadline?.state, evidence: step.deadline?.evidence};
      fact(stepCard, '截止规则', dl, sourceMap);
      if (step.applies_if) row(stepCard, '适用条件', step.applies_if);
      if (step.prerequisites?.length) row(stepCard, '前置步骤', step.prerequisites.join(language === 'en' ? ', ' : '、'));
      for (const doc of step.documents || []) {
        fact(stepCard, '申请材料', {value: doc.name + (doc.detail ? `：${doc.detail}` : ''), state: doc.state, evidence: doc.evidence}, sourceMap);
      }
      reviewNotice(stepCard, [['具体操作', step.action], ['办理入口', step.channel], ['截止规则', step.deadline],
        ...(step.documents || []).map(doc => ['申请材料', doc])], step.notes || []);
      steps.appendChild(stepCard);
    }
    card.appendChild(steps);
    if (programme.unresolved_questions?.length) {
      card.appendChild(el('h4', t('仍需核查')));
      const ul = el('ul', '', 'list');
      for (const question of programme.unresolved_questions) ul.appendChild(linkedEl('li', question));
      card.appendChild(ul);
    }
    results.appendChild(card);
  }
  if (data.discovery_clues?.length) {
    results.appendChild(el('h3', t('社媒项目与经验线索')));
    results.appendChild(el('p', t('以下来自搜索结果摘要，尚未确认笔记全文；用于发现项目和经验，不作为当前申请要求。'), 'dim small'));
    for (const clue of data.discovery_clues) {
      const card = el('div', '', 'programme');
      card.appendChild(link(clue.url, clue.title || clue.url));
      row(card, '平台', clue.platform);
      if (clue.snippet) card.appendChild(el('p', clue.snippet, 'small'));
      row(card, '发现用搜索词', clue.query);
      results.appendChild(card);
    }
  }
  if (data.search_log?.length) {
    const details = el('details');
    details.appendChild(el('summary', t('搜索记录（{count} 次）', {count:data.search_log.length})));
    const states = {results:'有结果', empty:'没有结果', error:'访问失败'};
    for (const attempt of data.search_log) {
      row(details, t('{state} · {count} 条', {state:t(states[attempt.status] || attempt.status), count:attempt.result_count}), attempt.query);
      if (attempt.note) details.appendChild(el('p', attempt.note, 'dim small'));
    }
    results.appendChild(details);
  }
  const sourcesHead = el('h3', t('资料来源（网页与本地知识库）'));
  sourcesHead.style.marginTop = '22px';
  results.appendChild(sourcesHead);
  const ul = el('ul', '', 'list sources');
  for (const source of data.sources || []) {
    const li = el('li', `${source.id} · ${t(source.publisher_type)} · ${t(source.read_status)} · `);
    li.appendChild(link(source.url, source.title));
    if (source.read_status === 'login_required') li.appendChild(el('span', t('（需要登录：仅提供网址，请自行查看）'), 'dim small'));
    else if (source.note) li.appendChild(el('span', ` · ${source.note}`, 'dim small'));
    ul.appendChild(li);
  }
  results.appendChild(ul);
}

form.addEventListener('submit', async event => {
  event.preventDefault();
  const fields = new FormData(form);
  const body = Object.fromEntries(fields.entries());
  body.language = language;
  const provider = body.model_provider;
  delete body.model_provider;
  body.year_of_study = body.year_of_study ? Number(body.year_of_study) : null;
  body.max_programmes = Number(body.max_programmes);
  if (!body.programme_url) body.programme_url = null;
  runButton.disabled = true;
  busy = true;
  setStatus('正在查询项目线索、院校官网及申请详情；可能需要数分钟…');
  panel.hidden = false;
  results.replaceChildren(el('p', t('联网调查进行中，请稍候。')));
  downloadButton.hidden = true;
  try {
    const response = await fetch(`/api/research?provider=${encodeURIComponent(provider)}`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    const data = await response.json();
    if (!response.ok) throw new Error(typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail));
    lastResult = data;
    lastKnowledge = null;
    render(data);
    downloadButton.hidden = false;
    setStatus('完成：{programmes} 个项目，{sources} 个来源。', {programmes:data.programmes.length, sources:data.sources.length});
  } catch (error) {
    results.replaceChildren(el('div', error.message, 'error'));
    setStatus('调查未完成。');
  } finally { runButton.disabled = false; busy = false; }
});

downloadButton.addEventListener('click', () => {
  if (!lastResult) return;
  const blob = new Blob([JSON.stringify(lastResult, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'exchangeprep_research_result.json'; a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('knowledge-button').addEventListener('click', async () => {
  const query = document.getElementById('knowledge-query').value.trim();
  if (!query) { setStatus('请输入知识库搜索词。'); return; }
  const button = document.getElementById('knowledge-button');
  button.disabled = true;
  try {
    const response = await fetch(`/api/knowledge-base?query=${encodeURIComponent(query)}`);
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || t('查询失败'));
    panel.hidden = false; downloadButton.hidden = true; lastResult = null;
    lastKnowledge = data.matches;
    results.replaceChildren();
    renderKnowledge(results, data.matches);
    if (!data.matches.length) results.appendChild(el('p', t('没有匹配内容；可换用国家名称或办理事项。')));
    setStatus('已查询本地知识库；本次没有联网或调用大模型。');
  } catch (error) { setStatus(error.message); }
  finally { button.disabled = false; }
});

sampleButton.addEventListener('click', async () => {
  const response = await fetch('/api/sample');
  const data = await response.json();
  if (!response.ok) { setStatus('离线示例加载失败。'); return; }
  lastResult = data; lastKnowledge = null; panel.hidden = false; render(data); downloadButton.hidden = false;
  setStatus('已载入离线示例；没有执行实时搜索。');
});

setLanguage(language);
(async () => {
  const year = new Date().getFullYear() + 1;
  form.elements.start_date.value = `${year}-06-01`;
  form.elements.end_date.value = `${year}-08-31`;
  try {
    const config = await (await fetch('/api/config')).json();
    const preferred = config.llm_provider === 'deepseek' || (!config.openai_configured && config.deepseek_configured) ? 'deepseek' : 'openai';
    form.elements.model_provider.value = preferred;
    const providerOk = preferred === 'deepseek' ? config.deepseek_configured : config.openai_configured;
    const searchOk = config.search_provider === 'brave' ? config.brave_configured :
      config.search_provider === 'openai' ? config.openai_configured :
      config.search_provider === 'browser' ? config.deepseek_configured :
      config.search_provider === 'manual' ? true :
      (config.brave_configured || config.openai_configured || config.deepseek_configured);
    setStatus(providerOk && searchOk ? '已就绪：{provider} 模型，可自动搜索。' :
      providerOk ? '已就绪：{provider} 模型；提供项目官网可进行定向调查。' :
      '缺少模型 API Key：请按 README 配置后重启服务。', {provider:preferred});
  } catch { setStatus('无法读取服务配置。'); }
})();
</script>
</body>
